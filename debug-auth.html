<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Auth State</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-box { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .status { font-weight: bold; }
        .true { color: green; }
        .false { color: red; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Debug de Estado de Autenticación</h1>
    
    <div class="debug-box">
        <h3>Estado Actual</h3>
        <p>Token en cookies: <span id="cookieToken" class="status">Cargando...</span></p>
        <p>Token en localStorage: <span id="localToken" class="status">Cargando...</span></p>
        <p>Auth Store en localStorage: <span id="authStore" class="status">Cargando...</span></p>
    </div>
    
    <div class="debug-box">
        <h3>Test API</h3>
        <button onclick="testProfile()">Probar /api/auth/profile</button>
        <p id="apiResult">Presiona el botón para probar la API</p>
    </div>
    
    <div class="debug-box">
        <h3>Test Login</h3>
        <button onclick="testLogin()">Probar Login (test@example.com / 123456)</button>
        <p id="loginResult">Presiona el botón para probar login</p>
    </div>
    
    <div class="debug-box">
        <h3>Acciones</h3>
        <button onclick="clearAuth()">Limpiar Todo</button>
        <button onclick="refresh()">Refrescar</button>
    </div>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function updateStatus() {
            // Check cookie token
            const cookieToken = getCookie('token');
            document.getElementById('cookieToken').textContent = cookieToken ? 'Presente' : 'No encontrado';
            document.getElementById('cookieToken').className = cookieToken ? 'status true' : 'status false';

            // Check localStorage token
            const localToken = localStorage.getItem('token');
            document.getElementById('localToken').textContent = localToken ? 'Presente' : 'No encontrado';
            document.getElementById('localToken').className = localToken ? 'status true' : 'status false';

            // Check auth store
            const authStore = localStorage.getItem('auth-store');
            document.getElementById('authStore').textContent = authStore ? 'Presente' : 'No encontrado';
            document.getElementById('authStore').className = authStore ? 'status true' : 'status false';

            if (authStore) {
                try {
                    const parsed = JSON.parse(authStore);
                    console.log('Auth Store Content:', parsed);
                } catch (e) {
                    console.error('Error parsing auth store:', e);
                }
            }
        }

        async function testProfile() {
            const token = getCookie('token') || localStorage.getItem('token');
            
            if (!token) {
                document.getElementById('apiResult').textContent = 'No hay token disponible';
                return;
            }

            try {
                const response = await fetch('/api/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('apiResult').textContent = `✅ Éxito: ${JSON.stringify(data)}`;
                } else {
                    document.getElementById('apiResult').textContent = `❌ Error: ${response.status} ${response.statusText}`;
                }
            } catch (error) {
                document.getElementById('apiResult').textContent = `❌ Error: ${error.message}`;
            }
        }

        async function testLogin() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: '123456'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('loginResult').textContent = `✅ Login exitoso: ${data.user.firstName}`;
                    
                    // Simular lo que hace el frontend
                    document.cookie = `token=${data.token}; path=/; expires=${new Date(Date.now() + 7*24*60*60*1000).toUTCString()}`;
                    
                    setTimeout(updateStatus, 100);
                } else {
                    const error = await response.json();
                    document.getElementById('loginResult').textContent = `❌ Error: ${error.message}`;
                }
            } catch (error) {
                document.getElementById('loginResult').textContent = `❌ Error: ${error.message}`;
            }
        }

        function clearAuth() {
            // Clear all auth data
            document.cookie = 'token=; path=/; expires=Thu, 01 Jan 1970 00:00:01 GMT';
            localStorage.removeItem('token');
            localStorage.removeItem('auth-store');
            
            updateStatus();
            document.getElementById('apiResult').textContent = 'Estado limpiado';
            document.getElementById('loginResult').textContent = 'Estado limpiado';
        }

        function refresh() {
            location.reload();
        }

        // Initial load
        updateStatus();
        setInterval(updateStatus, 2000); // Update every 2 seconds
    </script>
</body>
</html>
