<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .product { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .loading { color: blue; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test de Productos</h1>
    <div id="status">Cargando...</div>
    <div id="products"></div>

    <script>
        async function testProducts() {
            const status = document.getElementById('status');
            const productsDiv = document.getElementById('products');
            
            try {
                status.innerHTML = '🔄 Probando API de productos...';
                status.className = 'loading';
                
                const response = await fetch('/api/products');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                status.innerHTML = `✅ API funcionando. ${data.products?.length || 0} productos encontrados`;
                status.className = 'success';
                
                if (data.products && data.products.length > 0) {
                    productsDiv.innerHTML = data.products.map(product => `
                        <div class="product">
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <p><strong>Precio:</strong> $${product.price}</p>
                            <p><strong>Stock:</strong> ${product.stock}</p>
                            ${product.images?.[0] ? `<p><strong>Imagen:</strong> ${product.images[0]}</p>` : '<p>Sin imagen</p>'}
                        </div>
                    `).join('');
                } else {
                    productsDiv.innerHTML = '<p>No hay productos disponibles</p>';
                }
                
            } catch (error) {
                status.innerHTML = `❌ Error: ${error.message}`;
                status.className = 'error';
                productsDiv.innerHTML = '';
            }
        }
        
        // Ejecutar test al cargar la página
        testProducts();
    </script>
</body>
</html>
