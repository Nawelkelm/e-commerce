<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Autenticación</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .loading { color: blue; }
        .error { color: red; }
        .success { color: green; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test de Autenticación</h1>
    <div>
        <button onclick="testLogin()">Test Login</button>
        <button onclick="testProfile()">Test Profile</button>
        <button onclick="checkCookies()">Check Cookies</button>
        <button onclick="clearAll()">Clear All</button>
    </div>
    <div id="results"></div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            results.appendChild(div);
        }

        async function testLogin() {
            try {
                addResult('🔄 Probando login...', 'loading');
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: '123456'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Login exitoso: ${JSON.stringify(data)}`, 'success');
                    
                    // Guardar token en cookie como lo haría la app
                    document.cookie = `token=${data.token}; path=/; max-age=${7 * 24 * 60 * 60}`;
                    addResult('✅ Token guardado en cookies', 'success');
                } else {
                    const error = await response.text();
                    addResult(`❌ Error en login: ${error}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Error de red: ${error.message}`, 'error');
            }
        }

        async function testProfile() {
            try {
                addResult('🔄 Probando profile...', 'loading');
                
                // Obtener token de cookies
                const cookies = document.cookie.split(';');
                const tokenCookie = cookies.find(cookie => cookie.trim().startsWith('token='));
                
                if (!tokenCookie) {
                    addResult('❌ No hay token en cookies', 'error');
                    return;
                }
                
                const token = tokenCookie.split('=')[1];
                addResult(`🔍 Token encontrado: ${token.substring(0, 20)}...`, 'info');
                
                const response = await fetch('/api/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    addResult(`✅ Profile obtenido: ${JSON.stringify(userData)}`, 'success');
                } else {
                    addResult(`❌ Error obteniendo profile: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        function checkCookies() {
            addResult('🔍 Cookies actuales:', 'info');
            const cookies = document.cookie.split(';');
            if (cookies.length === 1 && cookies[0] === '') {
                addResult('⚠️ No hay cookies', 'error');
            } else {
                cookies.forEach(cookie => {
                    addResult(`🍪 ${cookie.trim()}`, 'info');
                });
            }
        }

        function clearAll() {
            // Limpiar cookies
            document.cookie = 'token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            
            // Limpiar localStorage y sessionStorage
            localStorage.clear();
            sessionStorage.clear();
            
            // Limpiar resultados
            document.getElementById('results').innerHTML = '';
            
            addResult('✅ Todos los datos limpiados', 'success');
        }

        // Test automático al cargar
        window.onload = () => {
            addResult('🚀 Página cargada, lista para pruebas', 'info');
            checkCookies();
        };
    </script>
</body>
</html>
