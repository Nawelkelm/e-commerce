name: CI

# Corre en cada push a main y en cada PR hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se pushea varias veces seguidas, cancela las corridas viejas de la misma
# rama: no tiene sentido gastar minutos en un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint de sintaxis + tests)
    runs-on: ubuntu-latest

    # Los tests de integracion corren contra una PostgreSQL real: lo que hay
    # que verificar es que las consultas y las restricciones funcionen, y un
    # mock del ORM solo probaria que el mock hace lo que le dijimos.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tiendakit_test
        ports:
          - 5432:5432
        # Sin el healthcheck, los tests arrancan antes de que Postgres acepte
        # conexiones y fallan de forma intermitente.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      # Node 18 para igualar el runtime de producción (server/Dockerfile usa
      # node:18-alpine). Probar en otra versión no diría nada útil.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de sintaxis
        # node --check sobre todo el código, no sólo index.js: jest únicamente
        # carga lo que los tests importan, así que un error de sintaxis en un
        # controller sin tests pasaría inadvertido hasta el arranque.
        run: |
          fallos=0
          while IFS= read -r archivo; do
            if ! node --check "$archivo"; then
              echo "::error file=server/$archivo::error de sintaxis"
              fallos=$((fallos + 1))
            fi
          done < <(find src -name '*.js')
          echo "Archivos con error de sintaxis: $fallos"
          test "$fallos" -eq 0

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://ecommerce:ci@localhost:5432/tiendakit_test
          DB_SSL: "false"
          JWT_SECRET: secreto-de-ci-no-usar-en-produccion
          JWT_REFRESH_SECRET: refresh-de-ci-no-usar-en-produccion
        run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        # Los errores bloquean; los warnings de exhaustive-deps quedan a la
        # vista sin frenar el build (ver V1.10 en ROADMAP.md).
        run: npm run lint

      - name: Build de producción
        run: npm run build
